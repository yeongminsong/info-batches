<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Red rounded background -->
  <rect width="32" height="32" rx="6" fill="#D63031"/>
  <!-- White newspaper sheet -->
  <rect x="6" y="6" width="20" height="20" rx="2.5" fill="white"/>
  <!-- Bold headline bar -->
  <rect x="9" y="9.5" width="14" height="3.5" rx="1" fill="#D63031"/>
  <!-- Subtext lines -->
  <rect x="9" y="15.5" width="14" height="1.8" rx="0.9" fill="#D63031" opacity="0.35"/>
  <rect x="9" y="19" width="10" height="1.8" rx="0.9" fill="#D63031" opacity="0.35"/>
  <rect x="9" y="22.5" width="12" height="1.8" rx="0.9" fill="#D63031" opacity="0.35"/>
</svg>
